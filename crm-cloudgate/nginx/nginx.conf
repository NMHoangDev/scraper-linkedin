worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;

    server {
        listen 8080;

        # CRM backend (FastAPI) — không có route SSE/WebSocket nào trong
        # module này (đã kiểm tra: crm_lead/crm_customer/crm_contact/
        # customer_lead/contract/quote đều là request/response thường), nên
        # chỉ cần 1 location đơn giản, không cần cấu hình đặc biệt như
        # nginx-router/nginx.conf của app seeding gốc (vốn có thêm SSE/WS cho Zalo).
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (Next.js)
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
