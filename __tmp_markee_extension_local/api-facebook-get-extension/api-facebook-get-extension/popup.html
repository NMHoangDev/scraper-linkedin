<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FB API Auto Crawler</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 400px;
      padding: 16px;
      margin: 0;
      background: #f0f2f5;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #1c1e21;
      font-size: 18px;
    }
    button {
      background: #1877f2;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover {
      background: #166fe5;
    }
    button:disabled {
      background: #e4e6eb;
      color: #bcc0c4;
      cursor: not-allowed;
    }
    #status {
      font-size: 13px;
      color: #65676b;
      margin-bottom: 12px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🤖 FB API Auto Crawler</h2>
    <p style="font-size: 12px; color: #65676b; margin-top: 0; margin-bottom: 15px;">Extension sẽ tự động gọi API lấy danh sách Group từ Backend, mở tab, reload session 2 lần, cào API và chắt lọc bài tự động.</p>
    
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <button id="btnAutoStart" style="background: #1877f2; margin: 0;">🚀 Bắt đầu Tự động</button>
        <button id="btnAutoStop" style="background: #e4405f; margin: 0;" disabled>🛑 Dừng</button>
    </div>
    
    <div id="status">Sẵn sàng chờ lệnh...</div>
    
    <!-- Khung hiển thị log trực tiếp -->
    <div id="logPanel" style="display: block; height: 250px; overflow-y: auto; background: #282c34; color: #abb2bf; font-family: monospace; font-size: 11px; padding: 8px; border-radius: 4px; white-space: pre-wrap;"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
