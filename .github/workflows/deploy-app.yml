name: Deploy App (Production)

# Deploy len host APP/production (10.120.60.26) - CHI chay khi bam nut
# "Run workflow" thu cong trong tab Actions tren GitHub, khong tu dong chay
# khi push/merge code (khac voi Deploy Dev). Dung de kiem soat khi nao code
# thuc su len production, sau khi da test o dev truoc.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Nhanh/commit muon deploy (de trong = dung main moi nhat)"
        required: false
        default: "main"

jobs:
  deploy:
    runs-on: [self-hosted, app]
    defaults:
      run:
        working-directory: /opt/apps/seeding_markeeai/scraper-linkedin
    steps:
      - name: Pull code theo ref duoc chon
        run: |
          git fetch origin
          git checkout "${{ github.event.inputs.ref }}"
          git pull origin "${{ github.event.inputs.ref }}" || true

      # Docker build cua frontend chi thay context ./linkedin-crawler-ui nen
      # KHONG thay duoc thu muc ngoai ../extensions -> npm predev/prebuild se
      # tu bo qua va dung nguyen public/*.zip da commit tu lan cuoi co ai do
      # nho tay build+commit lai, de bi cu (bug da gap: sua extensions/ nhung
      # quen build lai zip). Chay rieng buoc nay tren host (repo day du, thay
      # ca extensions/ lan linkedin-crawler-ui/) truoc khi build image de zip
      # luon la ban moi nhat tu source, khong phu thuoc nguoi lam co nho hay
      # khong.
      - name: Dong goi lai extension zip tu source moi nhat
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo/linkedin-crawler-ui \
            node:20-alpine \
            sh -c "npm ci && npm run build:extensions"

      - name: Build frontend + backend
        run: docker compose build frontend backend

      - name: Ap dung container moi
        run: |
          docker compose up -d frontend backend
          sleep 5
          docker compose restart router
          docker image prune -f

      - name: Kiem tra healthcheck
        run: |
          sleep 3
          curl -sf -o /dev/null http://localhost:8080/ || (echo "Frontend khong phan hoi" && exit 1)
          curl -sf -o /dev/null http://localhost:8080/api/all-platform/auth/me || echo "Luu y: auth/me khong phai 200 (co the do chua dang nhap, khong tinh la loi)"
