name: Deploy Dev

# 2026-07-09: TAM TAT auto-deploy khi push/merge len dev (code merge vao
# con loi, tu dong len dev gay loi lien tuc). Gio phai bam "Run workflow"
# thu cong trong tab Actions tren GitHub moi deploy, giong Deploy App
# (Production). Chay tren self-hosted runner cai san tren chinh host do,
# thao tac truc tiep tren thu muc deploy hien co (khong dung actions/checkout
# vi day la "pull + rebuild" tren may that, khong phai build tu checkout moi).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Nhanh/commit muon deploy (de trong = dung dev moi nhat)"
        required: false
        default: "dev"

jobs:
  deploy:
    runs-on: [self-hosted, dev]
    defaults:
      run:
        working-directory: /opt/apps/seeding_markeeai/scraper-linkedin
    steps:
      - name: Pull code theo ref duoc chon
        run: |
          git fetch origin
          git checkout "${{ github.event.inputs.ref }}"
          git pull origin "${{ github.event.inputs.ref }}" || true

      - name: Build frontend + backend
        run: docker compose build frontend backend

      - name: Ap dung container moi
        run: |
          docker compose up -d frontend backend
          sleep 5
          docker compose restart router
          docker image prune -f

      - name: Kiem tra healthcheck
        run: |
          sleep 3
          curl -sf -o /dev/null http://localhost:8080/ || (echo "Frontend khong phan hoi" && exit 1)
          curl -sf -o /dev/null http://localhost:8080/api/all-platform/auth/me || echo "Luu y: auth/me khong phai 200 (co the do chua dang nhap, khong tinh la loi)"
