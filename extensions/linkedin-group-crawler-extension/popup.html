<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn Group Crawler</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>LinkedIn Group Post Crawler</h1>

    <section>
      <label>URL group LinkedIn (mỗi dòng 1 URL)</label>
      <textarea id="groupUrls" rows="3" placeholder="https://www.linkedin.com/groups/1234567/"></textarea>
    </section>

    <section class="row">
      <div>
        <label>Số bài tối đa / group</label>
        <input id="maxPosts" type="number" min="1" value="40" />
      </div>
      <div>
        <label>Delay cuộn min (ms)</label>
        <input id="scrollDelayMinMs" type="number" min="500" value="2500" />
      </div>
      <div>
        <label>Delay cuộn max (ms)</label>
        <input id="scrollDelayMaxMs" type="number" min="500" value="5000" />
      </div>
    </section>

    <section class="row">
      <label class="checkbox"><input id="autoNextGroup" type="checkbox" checked /> Tự chuyển group tiếp theo</label>
    </section>

    <details>
      <summary>Cấu hình backend</summary>
      <section class="row">
        <div>
          <label>API Base URL</label>
          <input id="apiBase" type="text" value="http://localhost:8000" />
        </div>
        <div>
          <label>API Key</label>
          <input id="apiKey" type="text" value="markee-extension-key-2024" />
        </div>
      </section>
      <section>
        <label>id_member (tuỳ chọn, để trống nếu không có)</label>
        <input id="idMember" type="text" placeholder="UUID app_users (tuỳ chọn)" />
      </section>
    </details>

    <section class="row buttons">
      <button id="startBtn">▶ Bắt đầu cào</button>
      <button id="stopBtn" disabled>■ Dừng</button>
    </section>

    <section class="stats">
      <span id="statPosts">0 bài</span>
      <span id="statScroll">0 lần cuộn</span>
      <span id="statGroup">Group 0/0</span>
    </section>

    <section>
      <label>Kết quả lưu backend</label>
      <div id="saveResults" class="save-results"></div>
    </section>

    <section>
      <label>Log</label>
      <div id="log" class="log"></div>
    </section>

    <section class="row buttons">
      <button id="exportJsonBtn">Xuất JSON</button>
      <button id="exportCsvBtn">Xuất CSV</button>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
