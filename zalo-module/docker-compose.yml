services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LINKEDIN_CRAWLER_API_URL: ${ZALO_MODULE_PUBLIC_URL:-http://localhost:18190}
        NEXT_PUBLIC_LINKEDIN_CRAWLER_API_KEY: ${NEXT_PUBLIC_LINKEDIN_CRAWLER_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    image: zalo-module-frontend:latest
    container_name: zalo-module-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    expose:
      - "3000"
    networks:
      zalo-module-net:
        aliases: [frontend]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zalo-module-backend:latest
    container_name: zalo-module-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - backend-artifacts:/app/artifacts
    expose:
      - "8000"
    networks:
      zalo-module-net:
        aliases: [backend]

  router:
    image: nginx:alpine
    container_name: zalo-module-router
    restart: unless-stopped
    depends_on: [frontend, backend]
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${ZALO_MODULE_ROUTER_PORT:-18190}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      zalo-module-net:
        aliases: [router]

networks:
  zalo-module-net:

volumes:
  backend-artifacts:
